<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PublishOS — Video Publication Command Center</title>
<meta name="description" content="PublishOS: pipeline, approvals, scheduling and analytics for video publishing.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">P</div>
      <div>
        <div class="brand-name">Publish<span>OS</span></div>
        <div class="brand-sub">video publication command center</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-view="dashboard" onclick="App.go('dashboard')">Dashboard</button>
      <button class="tab" data-view="campaigns" onclick="App.gotoCampaigns()">Campaigns</button>
    </nav>
    <div class="topbar-right">
      <span class="date-chip" id="date-chip"></span>
      <button class="btn btn-sm btn-ghost" title="Download a JSON backup" onclick="App.exportData()">⤓ Backup</button>
      <button class="btn btn-sm btn-ghost" title="Restore from a JSON backup" onclick="App.importData()">⤒ Restore</button>
    </div>
  </header>
  <main id="view"></main>
  <div class="footer-note">
    PublishOS · your data never leaves this browser (localStorage) · nothing ships without your explicit approval
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
